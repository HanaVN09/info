<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hana Der - Ultimate Cyber Bio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #030305;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- BẢNG THÔNG BÁO CHÀO MỪNG --- */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-box {
            background: rgba(13, 13, 20, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.6);
            border-radius: 28px;
            padding: 35px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.35), inset 0 0 15px rgba(0, 243, 255, 0.15);
            animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .welcome-box h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
        }

        .welcome-box p {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .enter-btn {
            background: linear-gradient(135deg, #00f3ff, #ff007f);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            width: 100%;
        }

        .enter-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.8);
        }

        /* --- HIỆU NỨNG ĐÈN NỀN NEON DI CHUYỂN LIÊN TỤC --- */
        .neon-bg-1, .neon-bg-2 {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -2;
            animation: moveGlow 8s ease-in-out infinite alternate;
        }

        .neon-bg-1 {
            background: rgba(0, 243, 255, 0.18);
            top: 10%;
            left: 15%;
        }

        .neon-bg-2 {
            background: rgba(255, 0, 128, 0.18);
            bottom: 10%;
            right: 15%;
            animation-delay: -4s;
        }

        @keyframes moveGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.2); }
        }

        /* --- KHUNG BIO CHÍNH (CÓ HIỆU ỨNG TRÔI NỔI & VIỀN RGB CHẠY) ---.container {
            width: 100%;
            max-width: 440px;
            background: rgba(12, 12, 20, 0.75);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 36px;
            padding: 40px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 243, 255, 0.12);
            text-align: center;
            position: relative;
            z-index: 2;
            animation: floatCard 5s ease-in-out infinite alternate;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* --- AVATAR VIDEO VỚI VIỀN XOAY SÁNG CHÓI --- */
        .avatar-container {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 22px;
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f3ff, #ff007f, #7000ff, #00f3ff);
            z-index: -1;
            animation: rotateNeon 3s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.6));
        }

        @keyframes rotateNeon {
            100% { transform: rotate(360deg); }
        }

        .avatar-video {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #080810;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-container:hover .avatar-video {
            transform: scale(1.1);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.35);
        }

        h1 i {
            font-size: 18px;
            color: #00f3ff;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8));
        }

        p.bio {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.5;
        }

        /* --- NÚT NHẠC GÓC TRÊN CÓ HIỆU ỨNG THỞ --- */
        .music-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(13, 13, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.6);
            color: #00f3ff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            animation: pulseMusic 2s infinite;
        }

        @keyframes pulseMusic {
            0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(0, 243, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
        }

        .music-toggle:hover {
            transform: scale(1.15) rotate(15deg);
            background: rgba(0, 243, 255, 0.25);
            border-color: #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        .music-toggle.playing i {
            animation: spin 2.5s linear infinite;
            color: #ff007f;
            filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.9));
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* --- CÁC NÚT LINK CÓ HIỆU ỨNG SÁNG BÓNG & HOVER ĐỈNH CAO --- */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 25px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px 22px;
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng vệt sáng quét qua nút */
        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent);
            transition: 0.6s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item .left-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-item i.icon {
            font-size: 20px;
            width: 26px;
            text-align: center;
            color: #00f3ff;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.5));
        }

        .link-item .fa-arrow-right {
            font-size: 12px;
            color: #718096;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-item:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: #00f3ff;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.35);
        }

        .link-item:hover i.icon {
            transform: scale(1.25) rotate(10deg);
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.9));
        }

        .link-item:hover .fa-arrow-right {
            transform: translateX(6px);
            color: #00f3ff;
        }

        /* --- ICON MẠNG XÃ HỘI TRÒN PHÍA DƯỚI --- */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .social-icon {
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: #ff007f;
            color: #ffffff;
            border-color: #ff007f;
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #718096;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- BẢNG THÔNG BÁO CHÀO MỪNG -->
    <div class="welcome-overlay" id="welcomeModal">
        <div class="welcome-box">
            <h2>Thông Báo ‼️</h2>
            <p>Trời Lạnh Quá ❄️<br>Mùa Đông Đến Rồi😿</p>
            <button class="enter-btn" onclick="enterWebsite()">Tắt Thông Báo</button>
        </div>
    </div>

    <!-- Hiệu ứng đèn nền -->
    <div class="neon-bg-1"></div>
    <div class="neon-bg-2"></div>

    <!-- Nút Bật/Tắt Nhạc Nền -->
    <div class="music-toggle" id="musicBtn" onclick="toggleMusic()" title="Bật/Tắt nhạc nền">
        <i class="fa-solid fa-music"></i>
    </div>

    <!-- Nhạc nền -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/7zrert.mp3" type="audio/mp3">
    </audio>

    <div class="container">
        <div class="avatar-container">
            <!-- Video Anime Avatar -->
            <video id="avatarVideo" class="avatar-video" loop playsinline>
                <source src="https://files.catbox.moe/bnphwb.mp4" type="video/mp4">
            </video>
        </div>

        <h1>Hana Der <i class="fa-solid fa-circle-check"></i></h1>
        <p class="bio">Cập Nhật Mọi Thông Tin Mới Nhất Tại Kênh Telegram</p>

        <div class="links-list">
            <!-- Link TikTok -->
            <a href="https://www.tiktok.com/@hanagumball" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-brands fa-tiktok icon"></i>
                    <span>TikTok</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- Link Telegram -->
            <a href="https://t.me/InfoMe_Hana" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-brands fa-telegram icon"></i>
                    <span>Telegram</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- Nút Tải Mọi File Tại Đây -->
            <a href="https://linkbio.co/hanavn1" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-solid fa-cloud-arrow-down icon"></i>
                    <span>Tải Mọi File Tại Đây</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div class="social-icons">
            <a href="https://www.tiktok.com/@hanagumball" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://t.me/InfoMe_Hana" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://linkbio.co/hanavn1" target="_blank" class="social-icon"><i class="fa-solid fa-cloud-arrow-down"></i></a>
        </div>

        <div class="footer">
            © 2026 Hana Der. All rights reserved.
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const welcomeModal = document.getElementById('welcomeModal');
        const avatarVideo = document.getElementById('avatarVideo');
        let isPlaying = false;

        function enterWebsite() {
            music.volume = 0.5;
            music.play().then(() => {
                isPlaying = true;
                musicBtn.classList.add('playing');
                musicBtn.innerHTML = '<i class="fa-solid fa-compact-disc"></i>';
            }).catch(e => {
                console.log("Không phát được nhạc:", e);
            });

            avatarVideo.play().catch(e => {
                console.log("Không phát được video:", e);
            });

            welcomeModal.style.opacity = '0';
            welcomeModal.style.visibility = 'hidden';
            setTimeout(() => {
                welcomeModal.style.display = 'none';
            }, 500);
        }

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.classList.remove('playing');
                musicBtn.innerHTML = '<i class="fa-solid fa-music"></i>';
            } else {
                music.play().catch(e => console.log("Lỗi phát nhạc"));
                musicBtn.classList.add('playing');
                musicBtn.innerHTML = '<i class="fa-solid fa-compact-disc"></i>';
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
